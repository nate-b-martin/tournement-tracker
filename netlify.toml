[build]
# `vite` is aliased to @voidzero-dev/vite-plus-core, which ships no `vite` bin;
# the build has to go through the project-local Vite+ CLI.
command = "npx vp build"
dir = "dist/client"
[dev]
command = "npx vp dev"
targetPort = 3000
port = 8888

[[headers]]
for = "/*"
[headers.values]
# Self-hosted Convex listens on :3210 (client sync, including its WebSocket
# upgrade) and :3211 (site proxy for HTTP actions/JWKS). Clerk domains have been
# removed (ticket 11). `challenges.cloudflare.com` stays in script-src/frame-src.
Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' http://localhost:3210 ws://localhost:3210 http://127.0.0.1:3210 ws://127.0.0.1:3210 http://localhost:3211 http://127.0.0.1:3211; frame-src https://challenges.cloudflare.com; object-src 'none'; base-uri 'self'; frame-ancestors 'self'"
Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
X-Frame-Options = "SAMEORIGIN"
X-Content-Type-Options = "nosniff"
Referrer-Policy = "strict-origin-when-cross-origin"
Permissions-Policy = "camera=(), microphone=(), geolocation=()"

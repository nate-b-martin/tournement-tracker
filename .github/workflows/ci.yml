name: CI

on:
  pull_request:
  push:
    branches: ["main"]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Installs Vite+, the pinned Node.js version, the package manager, and
      # project dependencies (with dependency caching) in one step.
      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: "24.22.0"
          cache: true

      - name: Run lint and type checks
        run: vp check

      - name: Build
        run: vp build

      - name: Detect unit tests
        id: detect_unit
        run: |
          set -eo pipefail
          # look for common test filename patterns
          if git ls-files -- "**/*.test.*" "**/*.spec.*" | grep -q .; then
            echo "has_unit=true" >> $GITHUB_OUTPUT
          else
            echo "has_unit=false" >> $GITHUB_OUTPUT
          fi

      - name: Run unit tests (Vitest via Vite+)
        if: ${{ steps.detect_unit.outputs.has_unit == 'true' }}
        run: vp test

      - name: Check for e2e script
        id: check_e2e
        run: |
          node -e "const fs=require('fs');const pkg=JSON.parse(fs.readFileSync('package.json')); const has=Boolean(pkg.scripts && (pkg.scripts['test:e2e'] || pkg.scripts.e2e)); process.stdout.write(has? 'true':'false');" > has_e2e.txt
          echo "has_e2e=$(cat has_e2e.txt)" >> $GITHUB_OUTPUT

      - name: Start local Convex (for e2e)
        if: ${{ steps.check_e2e.outputs.has_e2e == 'true' }}
        run: |
          echo "Starting Convex dev server"
          vp exec convex dev &> convex.log & echo $! > convex.pid
          # wait for convex to be ready (check if it's running and has initialized)
          for i in $(seq 1 60); do
            if grep -q "Convex functions ready" convex.log 2>/dev/null; then
              echo "Convex is up and ready"
              break
            fi
            echo "Waiting for Convex... ($i)"
            sleep 1
          done
          tail -n +1 convex.log | sed -n '1,200p'

      - name: Seed Convex database
        if: ${{ steps.check_e2e.outputs.has_e2e == 'true' }}
        run: |
          # Call the seed function via Convex CLI
          sleep 2
          vp exec convex run seed || true

      - name: Install Playwright Browsers
        if: ${{ steps.check_e2e.outputs.has_e2e == 'true' }}
        run: vp exec playwright install --with-deps

      - name: Export Convex env for e2e
        if: ${{ steps.check_e2e.outputs.has_e2e == 'true' }}
        run: |
          echo "VITE_CONVEX_URL=http://localhost:3210" >> $GITHUB_ENV

      - name: Debug - Verify env vars are set
        if: ${{ steps.check_e2e.outputs.has_e2e == 'true' }}
        run: |
          echo "VITE_CONVEX_URL: $VITE_CONVEX_URL"
          if [ -z "$VITE_CONVEX_URL" ]; then
            echo "❌ ERROR: VITE_CONVEX_URL is empty!"
            exit 1
          fi
          echo "✅ VITE_CONVEX_URL is set"

      - name: Run e2e tests (Playwright)
        if: ${{ steps.check_e2e.outputs.has_e2e == 'true' }}
        timeout-minutes: 30
        env:
          CI: "true"
          VITE_CONVEX_URL: ${{ env.VITE_CONVEX_URL }}
        run: vp run test:e2e

      - name: Upload test results on failure
        if: ${{ failure() && steps.check_e2e.outputs.has_e2e == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Show server logs on failure
        if: ${{ failure() && steps.check_e2e.outputs.has_e2e == 'true' }}
        run: |
          echo "=== Dev Server Logs (last 50 lines) ==="
          tail -50 dev.log || echo "dev.log not found"
          echo ""
          echo "=== Convex Server Logs (last 50 lines) ==="
          tail -50 convex.log || echo "convex.log not found"
